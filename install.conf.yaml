- defaults:
    link:
        create: true
        relink: true
        force: true
    shell:
        stdout: true
        stderr: true

- clean:
  - '~'
  - '~/.config'
  - '~/.config/fish/completions'
  - '~/.config/fish/conf.d'
  - '~/.config/fish/functions'
  - '~/.config/starship'

# Create directory for coding projects
- create:
    - ~/Code
    - ~/Workspaces
    - ~/Dev
    - ~/Dev/homebrew
    - ~/Screenshots

- link:
    ~/Brewfile:
        path: Brewfile
    ~/.editorconfig: editorconfig/.editorconfig
    ~/.config/fish/config.fish: fish/config.fish
    ~/.config/fish/fish_plugins: fish/fish_plugins
    ~/.config/fish/conf.d:
        path: fish/conf.d/*.fish
        glob: true
    ~/.config/fish/functions:
        path: fish/functions/*.fish
        glob: true
    ~/.zshenv: zsh/.zshenv
    ~/.zshrc: zsh/.zshrc
    ~/Library/Application Support/Code/User/settings.json: vscode/settings.json
    ~/Library/Application Support/Code/User/keybindings.json: vscode/keybindings.json
    ~/Library/Application Support/Code - Insiders/User/settings.json: vscode/settings.json
    ~/Library/Application Support/Code - Insiders/User/keybindings.json: vscode/keybindings.json
    ~/Library/Application Support/VSCodium/User/settings.json: vscode/settings.json
    ~/Library/Application Support/VSCodium/User/keybindings.json: vscode/keybindings.json
    ~/.config/starship.toml:
      path: starship/starship.toml
      create: true
    ~/.gitattributes: git/.gitattributes
    ~/.gitconfig: git/.gitconfig
    ~/.gitignore: git/.gitignore
    ~/.config/bat/config: bat/config


- shell:
  - [./scripts/bootstrap.sh, Bootstrapping Homebrew, packages, plugins and macOS defaults]
